const hk=await crypto.subtle.importKey("raw",km.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
const iv=u(D.iv),ct=u(D.ct),msg=new Uint8Array(iv.length+ct.length);msg.set(iv);msg.set(ct,iv.length);
if(!await crypto.subtle.verify("HMAC",hk,u(D.tag),msg))throw 0;
const ak=await crypto.subtle.importKey("raw",km.slice(0,32),"AES-CBC",false,["decrypt"]);
const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv},ak,ct));
try{localStorage.setItem("dpw",pw)}catch(e){}document.open();document.write(html);document.close();}
document.getElementById("f").onsubmit=e=>{e.preventDefault();open_(document.getElementById("p").value).catch(()=>{document.getElementById("e").textContent="Złe hasło";});};
let s=null;try{s=localStorage.getItem("dpw")}catch(e){}if(s)open_(s).catch(()=>{try{localStorage.removeItem("dpw")}catch(e){}});
</script></body></html>
